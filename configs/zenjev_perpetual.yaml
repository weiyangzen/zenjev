# ZenJev perpetual runtime config (§1.6–1.9).
# Source of truth for the always-on loop: dir-spool MQ over the normalized
# envelope spool, RSI LoRA training beside EMA inference, live console.
model_id: fastino/gliner2-base-v1
model_revision: 79c3a777abc572b4767922f3916cf63fb5754df2
schema:
  name: jev_tool_task
  version: 2
  language: auto
  description: Engineering-trace task and stack extraction, calibrated on the operator's agent-trace corpus.
  entities:
    task_detail: Concrete intent, constraint, or operation requested in the trace.
    tool: Tool, binary, or service actually used (git, tmux, pytest, docker, ...).
    programming_language: Programming or shell language used (Rust, Python, bash, C++, ...).
    technology: System, framework, or component named (Linux, NEMU, RV64, CUDA, PostgreSQL, ...).
  classifications:
    task_type: [coding, debugging, refactoring, testing, code_review, planning, research, operations, data_analysis, translation, tool_use, other]
    decision_choice: [Python, Rust, TypeScript, JavaScript, C++, C, Go, Java, SQL, Bash, Git, Docker, Kubernetes, PostgreSQL, PyTorch, pytest, cargo, tmux, CUDA, PEFT]
  fields:
    - {name: request_goal, dtype: str, description: Normalized request goal, required: false}
    - {name: response_summary, dtype: str, description: Short response outcome, required: false}
  relations: [uses_tool, uses_language, uses_technology]
  unknown_label_policy: reject
  word_splitter: whitespace
tool_task:
  name: jev-tool-task
  version: 2
  task_types: [coding, debugging, refactoring, testing, code_review, planning, research, operations, data_analysis, translation, tool_use, other]
  # Calibrated on the capture corpus: agent traces are dominated by tool_use and
  # planning; the tool allowlist remains the safety gate, while language and
  # technology labels are descriptive for open-domain traces.
  task_actions:
    coding: allow
    debugging: allow
    refactoring: allow
    testing: allow
    code_review: allow
    data_analysis: allow
    translation: allow
    tool_use: allow
    planning: review
    research: review
    operations: review
    other: review
  allowed_models:
    - {id: gpt-5.6-sol, provider: openai-compatible, aliases: [gpt-5.6, gpt-5-6-sol]}
    - {id: gpt-6-astra, provider: openai-compatible, aliases: [gpt-6-astra-latest]}
    - {id: deepseek-4.1f, provider: deepseek-compatible, aliases: [deepseek-chat]}
  # Entity allowlists are descriptive for open-domain agent traces: the
  # extractor's entity values are noisy, so a finite list cannot be a fair gate.
  # The safety gates are the observed-model allowlist (exact, from capture
  # metadata) and the task-type policy; any future tool execution must be
  # authorized by an exact allowlist on the *requested* tool, not on an
  # extracted guess.
  allowed_tools: []
  allowed_programming_languages: []
  allowed_technologies: []
  decision_choices: [Python, Rust, TypeScript, JavaScript, C++, C, Go, Java, SQL, Bash, Git, Docker, Kubernetes, PostgreSQL, PyTorch, pytest, cargo, tmux, CUDA, PEFT]
  decision_actions: [allow, review, reject]
  min_confidence: 0.25
  unknown_policy: unmapped
  require_evidence: false
sources:
  - {name: jevraw_dump_tree, kind: jsonl, location: /home/sansha/data/jevraw, license_note: Operator-owned capture corpus; consumed read-only., max_documents: 1000000}
mq:
  enabled: true
  adapter: dir-spool
  # The real queue lives inside the operator's data root: the feeder appends
  # normalized envelopes to /home/sansha/data/jevraw/_zenjev/queue.ndjson and
  # the Rust dir-spool adapter consumes it with byte-offset watermarks.
  source_root: /home/sansha/data/jevraw/_zenjev
  patterns: ["*.ndjson"]
  poll_interval_ms: 2000
  start_position: first
  batch: 16
  max_bytes: 67108864
  ack_wait_seconds: 30
  max_ack_pending: 16
  prefetch: 16
  max_deliver: 3
  dlq_path: runs/jev/perpetual/dlq.jsonl
  quarantine_path: runs/jev/perpetual/quarantine.jsonl
  wal_path: runs/jev/perpetual/wal.bin
  socket_path: runs/jev/perpetual/bridge.sock
  bridge_config: runs/jev/perpetual/bridge.json
  metrics_path: artifacts/mq/metrics.json
  replay_buffer: runs/jev/perpetual/replay-buffer.jsonl
  dedup_window: 200000
  tls_required: true
  secret_ref: null
  state_path: /home/sansha/data/jevraw/_zenjev/dir-spool-state.json
  exit_after_drain: false
teacher:
  provider: openai-compatible
  model: gpt-6-astra
  base_url: https://api.example.invalid/v1
  api_key_env: JEV_TEACHER_API_KEY
  timeout_s: 90
  temperature: 0
  max_retries: 2
  retry_backoff_s: 1.0
  cache_dir: runs/jev/teacher-cache
drift:
  # Self-supervised pairs vary hugely in difficulty, so the collapse guard uses
  # 256-record window means and requires five consecutive degraded windows; a
  # single hard batch can no longer trip a reset.
  eval_window: 256
  min_windows: 5
  # Self-supervised pair loss tracks corpus difficulty, not degradation, so the
  # loss ratio is advisory only; only non-finite weights/gradients or invalid
  # output reset the adapter (operator decision for the 205M model).
  loss_ratio: 1000000.0
  loss_margin: 0.0
  ema_norm_ratio: 3.0
  max_non_finite: 0
  reset_cooldown_steps: 50
  f1_absolute_drop: 0.15
  f1_relative_floor: 0.80
  validation_loss_ratio: 2.0
runtime:
  device: cuda
  model_path: /home/sansha/jev-model-base
  inference_max_length: 512
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  ema_decay: 0.999
  learning_rate: 0.0001
  grad_clip_norm: 1.0
  # Generations are published by consumed-record count (ZENJEV_PUBLISH_RECORDS,
  # default 10000) in zenjev_loop; the step cadence is effectively disabled so
  # the generation:records ratio stays exact. Checkpoints follow the same
  # interval (train_batch 4 x 2500 steps = 10000 records).
  publish_every_steps: 1000000000
  checkpoint_every_steps: 2500
  max_checkpoints: 5
  reset_warmup_steps: 2
  seed: 42
