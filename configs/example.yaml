model_id: fastino/gliner2-base-v1
model_revision: 79c3a777abc572b4767922f3916cf63fb5754df2
schema:
  name: tech_stack_2026
  description: Technologies explicitly recommended for a 2026 software stack.
  entities: [technology, company, version, benchmark, date]
  fields:
    - {name: recommendation, dtype: str, description: Recommended stack item, required: false}
    - {name: rationale, dtype: str, description: Evidence-based rationale, required: false}
  classifications:
    confidence: [high, medium, low]
  relations: [recommended_with, maintained_by, replaces]
sources:
  - name: local_corpus
    kind: jsonl
    location: data/source.jsonl
    license_note: User-provided corpus; verify redistribution rights.
    max_documents: 1000
  - name: stage0_corpus
    kind: jsonl
    location: data/stage0_corpus.jsonl
    license_note: Project-authored Stage 0 corpus; no third-party redistribution.
    max_documents: 100
teacher:
  provider: openai-compatible
  model: gpt-6-astra
  base_url: https://api.example.invalid/v1
  api_key_env: JEV_TEACHER_API_KEY
  timeout_s: 90
  temperature: 0
  max_retries: 2
  retry_backoff_s: 1.0
  cache_dir: runs/jev/teacher-cache
drift:
  eval_window: 256
  min_windows: 3
  loss_ratio: 2.0
  loss_margin: 0.0
  ema_norm_ratio: 3.0
  max_non_finite: 0
  reset_cooldown_steps: 100
  f1_absolute_drop: 0.15
  f1_relative_floor: 0.80
  validation_loss_ratio: 2.0
# Continual external-MQ ingestion (§1.5). Disabled by default; set
# `enabled: true` and fill the operator-selected adapter fields to activate.
# Credentials are secret references only (env:/file:) and are never values.
mq:
  enabled: false
  adapter: nats-jetstream
  endpoints: ["tls://nats.internal.example:4222"]
  stream: JEV_RECORDS
  subject: jev.records
  durable_name: jev-trainer
  consumer_group: null
  start_position: new
  batch: 64
  max_bytes: 33554432
  ack_wait_seconds: 30
  max_ack_pending: 16
  prefetch: 32
  max_deliver: 5
  dlq_subject: jev.dlq
  dlq_path: runs/jev/mq/dlq.jsonl
  quarantine_path: runs/jev/mq/quarantine.jsonl
  wal_path: runs/jev/mq/wal.bin
  socket_path: runs/jev/mq/bridge.sock
  bridge_config: runs/jev/mq/bridge.json
  metrics_path: artifacts/mq/metrics.json
  replay_buffer: runs/jev/mq/replay-buffer.jsonl
  dedup_window: 10000
  tls_required: true
  secret_ref: env:JEV_MQ_TOKEN
  source_path: null
  state_path: null
  exit_after_drain: false
runtime:
  device: cuda
  # Set this to a staged snapshot directory, or use JEV_MODEL_PATH on the host.
  model_path: null
  inference_max_length: 512
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  ema_decay: 0.999
  learning_rate: 0.0001
  grad_clip_norm: 1.0
  publish_every_steps: 1
  checkpoint_every_steps: 1
  max_checkpoints: 3
  reset_warmup_steps: 2
  seed: 42
