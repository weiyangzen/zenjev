model_id: fastino/gliner2-base-v1
model_revision: 79c3a777abc572b4767922f3916cf63fb5754df2
schema:
  name: tech_stack_2026
  description: Technologies explicitly recommended for a 2026 software stack.
  entities: [technology, company, version, benchmark, date]
  fields:
    - {name: recommendation, dtype: str, description: Recommended stack item, required: false}
    - {name: rationale, dtype: str, description: Evidence-based rationale, required: false}
  classifications:
    confidence: [high, medium, low]
  relations: [recommended_with, maintained_by, replaces]
sources:
  - name: local_corpus
    kind: jsonl
    location: data/source.jsonl
    license_note: User-provided corpus; verify redistribution rights.
    max_documents: 1000
teacher:
  provider: openai-compatible
  model: gpt-6-astra
  base_url: https://api.example.invalid/v1
  api_key_env: JEV_TEACHER_API_KEY
  timeout_s: 90
  temperature: 0
  max_retries: 2
  retry_backoff_s: 1.0
  cache_dir: runs/jev/teacher-cache
drift:
  eval_window: 256
  min_windows: 3
  loss_ratio: 2.0
  loss_margin: 0.0
  ema_norm_ratio: 3.0
  max_non_finite: 0
  reset_cooldown_steps: 100
  f1_absolute_drop: 0.15
  f1_relative_floor: 0.80
  validation_loss_ratio: 2.0
runtime:
  device: auto
  # Set this to a staged snapshot directory, or use JEV_MODEL_PATH on the host.
  model_path: null
  inference_max_length: 512
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  ema_decay: 0.999
  learning_rate: 0.0001
  grad_clip_norm: 1.0
  publish_every_steps: 10
  checkpoint_every_steps: 10
  max_checkpoints: 3
  reset_warmup_steps: 2
  seed: 42
