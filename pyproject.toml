[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev"
version = "0.1.0"
description = "Schema-driven GLiNER2 + LoRA continuous extraction runtime"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
runtime = ["gliner2[local]>=0.3.0", "torch>=2.1", "peft>=0.10"]
train = ["gliner2[train]>=0.3.0", "torch>=2.1", "peft>=0.10", "PyYAML>=6"]
test = ["pytest>=8"]

[project.scripts]
jev = "jev.cli:main"

[tool.setuptools.packages.find]
include = ["jev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

