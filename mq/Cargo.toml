[package]
name = "jev-mq-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "ZenJev external message-queue bridge: validate, deduplicate, spool, backpressure, ack after durable acceptance"
license = "Apache-2.0"

[[bin]]
name = "jev-mq-bridge"
path = "src/main.rs"

[features]
default = ["nats"]
nats = ["dep:async-nats", "dep:tokio", "dep:futures-util"]
kafka = []
iggy = []

[dependencies]
async-nats = { version = "0.50.0", default-features = false, features = ["ring", "jetstream"], optional = true }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }

[profile.release]
strip = true
